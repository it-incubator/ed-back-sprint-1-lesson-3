openapi: 3.0.0
info:
  title: API Documentation
  version: 1.0.0

tags:
  - name: Rides
    description: API for managing rides (JSON:API format)

paths:
  /api/rides:
    get:
      summary: Get a list of all rides
      tags: [Rides]
      security:
        - BasicAuth: []
      responses:
        200:
          description: List of all rides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideListOutput'
    post:
      summary: Create a new ride
      tags: [Rides]
      security:
        - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideCreateInput'
      responses:
        201:
          description: Ride successfully created for an existing free driver
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOutput'
        400:
          description: Validation error, driver does not exist, or the driver is busy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/rides/{id}:
    get:
      summary: Get a ride by ID
      tags: [Rides]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the ride
          schema:
            type: string
            example: 60c72b2f9b1e8a001c8e4f1a
      responses:
        200:
          description: The requested ride
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideOutput'
        404:
          description: Ride not found

  /api/rides/{id}/actions/finish:
    post:
      summary: Finish ride by ID
      tags: [Rides]
      security:
        - BasicAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: The unique identifier of the ride
          schema:
            type: string
            example: 60c72b2f9b1e8a001c8e4f1a
      responses:
        204:
          description: Ride finished successfully
        400:
          description: The ride has already been finished
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        404:
          description: Ride not found

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
  schemas:
    # Атрибуты поездки во входном запросе на создание.
    RideAttributes:
      type: object
      required:
        - clientName
        - price
        - currency
        - driverId
        - fromAddress
        - toAddress
      properties:
        clientName:
          type: string
          example: Alice Johnson
        price:
          type: number
          format: float
          example: 15.75
        currency:
          type: string
          enum: [usd, eur]
          example: usd
        driverId:
          type: string
          example: 5f1a2b3c4d5e6f7a8b9c0d1e
        fromAddress:
          type: string
          example: 123 Main St, Cityville
        toAddress:
          type: string
          example: 456 Elm St, Townsville
    # Атрибуты поездки в ответе (служебные даты createdAt/updatedAt наружу не отдаются).
    RideResourceAttributes:
      type: object
      required:
        - clientName
        - driver
        - vehicle
        - price
        - currency
        - addresses
      properties:
        clientName:
          type: string
          example: Alice Johnson
        driver:
          type: object
          properties:
            id:
              type: string
              example: 5f1a2b3c4d5e6f7a8b9c0d1e
            name:
              type: string
              example: Tom Rider
        vehicle:
          type: object
          properties:
            licensePlate:
              type: string
              example: XYZ 1234
            name:
              type: string
              example: Toyota Camry
        price:
          type: number
          format: float
          example: 15.75
        currency:
          type: string
          enum: [usd, eur]
          example: usd
        startedAt:
          type: string
          format: date-time
          nullable: true
          example: 2023-03-01T14:30:00Z
        finishedAt:
          type: string
          format: date-time
          nullable: true
          example: null
        addresses:
          type: object
          properties:
            from:
              type: string
              example: 123 Main St, Cityville
            to:
              type: string
              example: 456 Elm St, Townsville
    # JSON:API-ресурс поездки в ответе.
    RideResource:
      type: object
      properties:
        type:
          type: string
          enum: [rides]
        id:
          type: string
          example: 60c72b2f9b1e8a001c8e4f1a
        attributes:
          $ref: '#/components/schemas/RideResourceAttributes'
    RideCreateInput:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              enum: [rides]
            attributes:
              $ref: '#/components/schemas/RideAttributes'
    RideOutput:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/RideResource'
    RideListOutput:
      type: object
      properties:
        meta:
          type: object
        data:
          type: array
          items:
            $ref: '#/components/schemas/RideResource'
    ValidationError:
      type: object
      properties:
        field:
          type: string
          example: data.attributes.clientName
        message:
          type: string
          example: Client name is required
    ValidationErrorResponse:
      type: object
      properties:
        errorMessages:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
